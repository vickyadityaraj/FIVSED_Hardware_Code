[env:blackpill_f411ce]
src_dir = Core/Src
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink

; Native USB Full-Speed CDC is the Raspberry Pi/Windows control link.
; PA11 = USB D-, PA12 = USB D+ on STM32F411.
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_VID=0x0483
    -D USBD_PID=0x5740
    -I Core/Inc
board_build.ldscript = STM32F411CEU6_FLASH.ld
monitor_speed = 115200
monitor_dtr = 1
